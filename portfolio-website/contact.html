
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Harassis Singh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">My Portfolio</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-intro">
            <p class="section-label">GET IN TOUCH</p>
            <h1>Let's Work <span>Together</span></h1>
            <p>
                Have a project idea or an opportunity?
                Feel free to contact me using the form below.
            </p>
        </section>

        <section class="contact-card">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        required
                        minlength="10"
                    ></textarea>
                </div>

                <button type="submit" class="btn">Send Message</button>
                <p id="formStatus" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Harassis Singh. All rights reserved.</p>
    </footer>

    <script>
        const contactForm = document.getElementById("contactForm");
        const formStatus = document.getElementById("formStatus");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();

            formStatus.textContent =
                "Thank you! The form passed validation. This demo does not send messages yet.";

            contactForm.reset();
        });
    </script>

</body>
</html>
